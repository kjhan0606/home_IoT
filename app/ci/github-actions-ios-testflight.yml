# TEMPLATE — iOS build + TestFlight upload on a GitHub-hosted macOS runner.
# Not active: it lives outside .github/workflows on purpose. To use it:
#   1. copy to .github/workflows/ios-testflight.yml
#   2. create the repository secrets listed below (never commit them)
#   3. fill the placeholders in app/ios/ExportOptions.plist (team id, profile name)
#   4. run it manually (Actions -> iOS TestFlight -> Run workflow)
#
# Secrets (placeholders; create in Settings -> Secrets and variables -> Actions):
#   IOS_DIST_CERT_P12_BASE64     base64 of the Apple Distribution certificate (.p12)
#   IOS_DIST_CERT_PASSWORD       password of that .p12
#   IOS_PROVISION_PROFILE_BASE64 base64 of the App Store provisioning profile for com.kjhan0606.homeiot
#   KEYCHAIN_PASSWORD            any random string (temporary CI keychain)
#   ASC_KEY_ID                   App Store Connect API key id
#   ASC_ISSUER_ID                App Store Connect issuer id
#   ASC_KEY_P8_BASE64            base64 of AuthKey_<ASC_KEY_ID>.p8
name: iOS TestFlight

on:
  workflow_dispatch: {}

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze + test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Install signing certificate + provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT=$RUNNER_TEMP/dist.p12; PROFILE=$RUNNER_TEMP/app.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$P12_BASE64" | base64 --decode -o "$CERT"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -t ios -f build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
